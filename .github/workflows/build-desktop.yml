name: Build desktop apps

# Builds FreeVisualizer.dmg (macOS, Apple Silicon + Intel) and a Windows installer.
# - a manual run (Actions → Run workflow) or a tag like v1.7.0 builds the installers
#   (Actions → run → Artifacts); with "release" set, a Release is published here.
# Every push only runs the tests (macOS minutes cost 10× on a private repo).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publică un Release cu acest tag (ex: v1.1.0). Gol = doar build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  mac:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      # Optional: add the secret MAC_CERT_P12_BASE64 (+ the ones below) to sign
      # and notarize with an Apple Developer account. Without it the app is
      # ad-hoc signed and opens via right-click → Open.
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (ad-hoc signed, no Apple account)
        if: env.HAS_MAC_CERT != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --universal --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
      - name: Build (signed + notarized)
        if: env.HAS_MAC_CERT == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --universal --publish never -c.mac.notarize=true
      - name: Check the app bundle
        run: |
          APP="dist/mac-universal/FreeVisualizer.app"
          lipo -archs "$APP/Contents/MacOS/FreeVisualizer"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FreeVisualizer-mac
          path: dist/*.dmg
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FreeVisualizer ${{ inputs.release || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.dmg

  windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: FreeVisualizer-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FreeVisualizer ${{ inputs.release || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.exe
